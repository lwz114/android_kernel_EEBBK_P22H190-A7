name: Build P21H180/P21H170 kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: Target device
        type: choice
        required: true
        default: p21h180
        options:
          - p21h180
          - p21h170
      profile:
        description: Build profile
        type: choice
        required: true
        default: standard
        options:
          - standard
          - droidspaces

permissions:
  contents: write

concurrency:
  group: ${{ inputs.device }}-${{ inputs.profile || 'standard' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-gnu-
      ANYKERNEL_DIR: ${{ github.workspace }}/out/AnyKernel3
      KPM_PATCHER: ${{ github.workspace }}/out/tools/patch_linux

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache Android Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-r383902
          key: clang-r383902-v1

      - name: Fetch Google Android clang r383902
        if: steps.cache-clang.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          CLANG_ROOT="$RUNNER_TEMP/clang-r383902"
          CLANG_DIR="$CLANG_ROOT/clang-r383902/bin"
          CLANG_REPO="$RUNNER_TEMP/clang-repo"
          mkdir -p "$CLANG_ROOT" out
          git clone --depth=1 --filter=blob:none --sparse \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$CLANG_REPO"
          git -C "$CLANG_REPO" sparse-checkout set clang-r383902
          cp -a "$CLANG_REPO/clang-r383902" "$CLANG_ROOT/"
          test -x "$CLANG_DIR/clang"
          "$CLANG_DIR/clang" --version | tee out/clang-version.txt
          grep -F 'b397f81060ce6d701042b782172ed13bee898b79' out/clang-version.txt

      - name: Select build profile
        shell: bash
        env:
          BUILD_DEVICE: ${{ inputs.device || 'p21h180' }}
          BUILD_PROFILE: ${{ inputs.profile || 'standard' }}
        run: |
          set -euo pipefail
          CLANG_DIR="$RUNNER_TEMP/clang-r383902/clang-r383902/bin"
          
          case "$BUILD_DEVICE" in
            p21h180)
              case "$BUILD_PROFILE" in
                standard)
                  profile=p21h180
                  defconfig=ums512-p21h180_defconfig
                  build_dir="$GITHUB_WORKSPACE/out/ums512-p21h180"
                  release_dir="$GITHUB_WORKSPACE/out/release"
                  socko_template="$GITHUB_WORKSPACE/prebuilts/p21h180/socko.factory.img"
                  build_script="./scripts/build-p21h180.sh"
                  package_pattern="P21h180-recovery-*.zip"
                  ;;
                droidspaces)
                  profile=droidspaces
                  defconfig=ums512-p21h180_droidspaces_defconfig
                  build_dir="$GITHUB_WORKSPACE/out/ums512-p21h180-droidspaces"
                  release_dir="$GITHUB_WORKSPACE/out/release-droidspaces"
                  socko_template="$GITHUB_WORKSPACE/prebuilts/p21h180/socko.factory.img"
                  build_script="./scripts/build-p21h180.sh"
                  package_pattern="P21h180-recovery-*.zip"
                  ;;
                *)
                  echo "unsupported profile: $BUILD_PROFILE" >&2
                  exit 2
                  ;;
              esac
              ;;
            p21h170)
              case "$BUILD_PROFILE" in
                standard)
                  profile=p21h170
                  defconfig=ums512-p21h170_defconfig
                  build_dir="$GITHUB_WORKSPACE/out/ums512-p21h170"
                  release_dir="$GITHUB_WORKSPACE/out/release-p21h170"
                  socko_template="$GITHUB_WORKSPACE/prebuilts/p21h170/socko.factory.img"
                  build_script="./scripts/build-p21h170.sh"
                  package_pattern="P21h170-recovery-*.zip"
                  ;;
                droidspaces)
                  profile=p21h170-droidspaces
                  defconfig=ums512-p21h170_droidspaces_defconfig
                  build_dir="$GITHUB_WORKSPACE/out/ums512-p21h170-droidspaces"
                  release_dir="$GITHUB_WORKSPACE/out/release-p21h170-droidspaces"
                  socko_template="$GITHUB_WORKSPACE/prebuilts/p21h170/socko.factory.img"
                  build_script="./scripts/build-p21h170.sh"
                  package_pattern="P21h170-recovery-*.zip"
                  ;;
                *)
                  echo "unsupported profile: $BUILD_PROFILE" >&2
                  exit 2
                  ;;
              esac
              ;;
            *)
              echo "unsupported device: $BUILD_DEVICE" >&2
              exit 2
              ;;
          esac
          {
            printf 'CLANG_DIR=%s
' "$CLANG_DIR"
            printf 'BUILD_PROFILE=%s
' "$profile"
            printf 'BUILD_DEFCONFIG=%s
' "$defconfig"
            printf 'BUILD_DIR=%s
' "$build_dir"
            printf 'RELEASE_DIR=%s
' "$release_dir"
            printf 'SOCKO_TEMPLATE=%s
' "$socko_template"
            printf 'BUILD_SCRIPT=%s
' "$build_script"
            printf 'PACKAGE_PATTERN=%s
' "$package_pattern"
          } >> "$GITHUB_ENV"
          printf 'device=%s
profile=%s
defconfig=%s
build_dir=%s
release_dir=%s
' \
            "$BUILD_DEVICE" "$profile" "$defconfig" "$build_dir" "$release_dir"

      - name: Install build and packaging dependencies
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '|azure\.archive\.ubuntu\.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y \
            bc bison cpio device-tree-compiler e2fsprogs fuse2fs flex fuse3 \
            gcc-aarch64-linux-gnu git kmod libelf-dev libncurses-dev \
            libssl-dev libyaml-dev lld perl python3 rsync unzip zip

      - name: Fetch KPM patcher and AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tools
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/main/kpm/patch_linux \
            -o "$KPM_PATCHER"
          echo '1bd00563e9d8fbbd11a16c0c1c59c5add406e6c5c92557def50f93d6f0aebe2d  out/tools/patch_linux' \
            | sha256sum --check
          chmod 755 "$KPM_PATCHER"
          file "$KPM_PATCHER"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$ANYKERNEL_DIR"
          test -f "$ANYKERNEL_DIR/anykernel.sh"

      - name: Build recovery upgrade package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          ANDROID_CLANG_DIR="$CLANG_DIR" \
          BUILD_PROFILE="$BUILD_PROFILE" \
          BUILD_DEFCONFIG="$BUILD_DEFCONFIG" \
          BUILD_DIR="$BUILD_DIR" \
          BUILD_OUTPUT_DIR="$RELEASE_DIR" \
          SOCKO_TEMPLATE="$SOCKO_TEMPLATE" \
          ANYKERNEL_DIR="$ANYKERNEL_DIR" \
          KPM_PATCHER="$KPM_PATCHER" \
          JOBS="$(nproc)" \
            $BUILD_SCRIPT all 2>&1 | tee out/build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify recovery upgrade package
        shell: bash
        run: |
          set -euo pipefail
          ls -lh "$RELEASE_DIR"
          package=$(find "$RELEASE_DIR" -maxdepth 1 -type f \
            -name '$PACKAGE_PATTERN' -size +1c -print -quit)
          test -n "$package"
          test "$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          sha256sum "$package"

      - name: Upload build package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device }}-${{ inputs.profile || 'standard' }}-packages-${{ github.sha }}
          path: |
            out/release*/*.zip
          if-no-files-found: warn
          compression-level: 0

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.device }}-${{ inputs.profile || 'standard' }}-${{ github.sha }}-${{ github.run_number }}
          name: ${{ inputs.device }} ${{ inputs.profile || 'standard' }} kernel ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: |
            out/release*/*.zip
